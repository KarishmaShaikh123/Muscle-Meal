<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Proceed to Checkout</title>
</head>
<body style="margin:0; font-family: Arial, sans-serif; background-color:#f5f5f5; color:#333;">

  <div style="max-width: 600px; margin: 40px auto; background: white; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); padding: 30px 40px;">

    <h1 style="color: #e60000; text-align: center; margin-bottom: 30px;">Checkout</h1>

    <form action="#" method="POST" style="display: flex; flex-direction: column; gap: 20px;">

      <!-- Name -->
      <label for="name" style="font-weight: 600; color: #555;">Full Name</label>
      <input type="text" id="name" name="name" required
        style="padding: 12px; border: 2px solid #ccc; border-radius: 6px; font-size: 16px; transition: border-color 0.3s;"
        onfocus="this.style.borderColor='#e60000'" onblur="this.style.borderColor='#ccc'">

      <!-- Email -->
      <label for="email" style="font-weight: 600; color: #555;">Email Address</label>
      <input type="email" id="email" name="email" required
        style="padding: 12px; border: 2px solid #ccc; border-radius: 6px; font-size: 16px; transition: border-color 0.3s;"
        onfocus="this.style.borderColor='#e60000'" onblur="this.style.borderColor='#ccc'">

      <!-- Phone -->
      <label for="phone" style="font-weight: 600; color: #555;">Phone Number</label>
      <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}"
        placeholder="10-digit number"
        style="padding: 12px; border: 2px solid #ccc; border-radius: 6px; font-size: 16px; transition: border-color 0.3s;"
        onfocus="this.style.borderColor='#e60000'" onblur="this.style.borderColor='#ccc'">

      <!-- Address -->
      <label for="address" style="font-weight: 600; color: #555;">Shipping Address</label>
      <textarea id="address" name="address" rows="4" required
        style="padding: 12px; border: 2px solid #ccc; border-radius: 6px; font-size: 16px; resize: vertical; transition: border-color 0.3s;"
        onfocus="this.style.borderColor='#e60000'" onblur="this.style.borderColor='#ccc'"></textarea>

      <!-- Payment Method -->
      <label for="payment" style="font-weight: 600; color: #555;">Payment Method</label>
      <select id="payment" name="payment" required
        style="padding: 12px; border: 2px solid #ccc; border-radius: 6px; font-size: 16px; transition: border-color 0.3s;"
        onfocus="this.style.borderColor='#e60000'" onblur="this.style.borderColor='#ccc'">
        <option value="" disabled selected>Select a payment method</option>
        <option value="cod">Cash on Delivery</option>
        <option value="credit_card">Credit / Debit Card</option>
        <option value="upi">UPI</option>
        <option value="netbanking">Net Banking</option>
      </select>

      <!-- Total Amount -->
      <div style="font-size: 18px; font-weight: 700; color: #e60000; margin-top: 10px;">
        Total Amount: ₹4950
      </div>

      <!-- Submit Button -->
      <button type="submit"
        style="background-color: #e60000; color: white; padding: 14px 0; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: background-color 0.3s;">
        Place Order
      </button>

    </form>

  </div>

  <!-- Footer -->
  <footer style="text-align: center; padding: 20px; font-size: 14px; color: #888;">
    &copy; 2025 Muscle Meal. All rights reserved.
  </footer>

</body>
</html>
